<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI Tick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Oswald:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0a14;
    --panel: #14101f;
    --panel-deep: #0e0b18;
    --ink: #060510;
    --neon: #3ef2c8;
    --neon-dim: #1f8a70;
    --pink: #ff5fa2;
    --cream: #ece7f7;
    --muted: #8a829e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1000px 600px at 50% 8%, rgba(255, 95, 162, 0.10) 0%, transparent 55%),
      radial-gradient(900px 650px at 50% 115%, rgba(62, 242, 200, 0.10) 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.014) 0 1px, transparent 1px 4px),
      linear-gradient(180deg, #100d1d 0%, #080710 100%);
    color: var(--cream);
    font-family: "Oswald", system-ui, -apple-system, sans-serif;
    padding: 28px 20px;
    overflow-x: hidden;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 480px;
    min-width: 0;
    background:
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.015) 0 1px, transparent 1px 4px),
      linear-gradient(180deg, #171226 0%, #120e1e 100%);
    border: 1px solid rgba(62, 242, 200, 0.28);
    border-radius: 16px;
    box-shadow:
      0 0 0 1px rgba(6, 5, 16, 0.8),
      0 0 34px rgba(62, 242, 200, 0.10),
      0 24px 60px rgba(0, 0, 0, 0.6);
    padding: 26px 24px 24px;
  }
  .row { display: flex; gap: 10px; align-items: center; }
  .mode-toggle {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: #100c1a;
    border: 1px solid rgba(62, 242, 200, 0.22);
    border-radius: 10px;
  }
  .mode-btn {
    flex: 1;
    padding: 8px 10px;
    font-family: "Orbitron", "Oswald", sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 7px;
    cursor: pointer;
    transition: color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
  }
  .mode-btn:hover { color: var(--cream); }
  .mode-btn.active {
    color: var(--neon);
    background: #171226;
    border-color: rgba(62, 242, 200, 0.45);
    box-shadow: 0 0 12px rgba(62, 242, 200, 0.18);
    text-shadow: 0 0 8px rgba(62, 242, 200, 0.5);
  }
  .tempo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    background: #100c1a;
    border: 1px solid rgba(62, 242, 200, 0.2);
    border-radius: 10px;
  }
  .tempo-row label {
    font-family: "Orbitron", "Oswald", sans-serif;
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    flex-shrink: 0;
  }
  .tempo-row input {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;
    font-family: "Share Tech Mono", ui-monospace, monospace;
    font-size: 1rem;
    color: var(--neon);
    background: #0b0812;
    border: 1px solid rgba(62, 242, 200, 0.25);
    border-radius: 6px;
    outline: none;
    text-align: right;
    -moz-appearance: textfield;
  }
  .tempo-row input::-webkit-outer-spin-button,
  .tempo-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .tempo-row input:focus { border-color: var(--neon); box-shadow: 0 0 0 2px rgba(62, 242, 200, 0.3); }
  .tempo-row .tempo-unit {
    flex-shrink: 0;
    font-family: "Share Tech Mono", ui-monospace, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    color: #7f789a;
  }
  .controls {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .controls .row { margin: 0; }
  .controls .device-row { margin-top: 0; }
  .device-row {
    margin-top: 8px;
    opacity: 0.7;
    transition: opacity 0.15s ease;
  }
  .device-row:hover, .device-row:focus-within { opacity: 1; }
  .device-row select {
    padding: 7px 10px;
    font-size: 0.78rem;
    color: #b6b0c9;
    background: #100c1a;
    border-color: rgba(62, 242, 200, 0.22);
    border-radius: 6px;
  }
  button.primary {
    flex: 1;
    padding: 13px 18px;
    font-family: "Orbitron", "Oswald", sans-serif;
    font-weight: 500;
    font-size: 0.92rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--neon);
    background: linear-gradient(180deg, #1a1428 0%, #120e1e 100%);
    border: 1px solid rgba(62, 242, 200, 0.5);
    border-radius: 10px;
    box-shadow:
      0 0 14px rgba(62, 242, 200, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    cursor: pointer;
    text-shadow: 0 0 8px rgba(62, 242, 200, 0.5);
    transition: transform 0.08s ease, box-shadow 0.12s ease, filter 0.12s ease;
  }
  button.primary:hover:not(:disabled) {
    filter: brightness(1.18);
    box-shadow:
      0 0 22px rgba(62, 242, 200, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  button.primary:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 0 10px rgba(62, 242, 200, 0.15);
  }
  button.primary:disabled {
    color: var(--muted);
    border-color: rgba(138, 130, 158, 0.35);
    text-shadow: none;
    box-shadow: none;
    cursor: not-allowed;
  }
  select {
    padding: 11px 12px;
    font-family: "Oswald", sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--cream);
    background: #100c1a;
    border: 1px solid rgba(62, 242, 200, 0.28);
    border-radius: 8px;
    outline: none;
    max-width: 100%;
  }
  select:focus {
    border-color: var(--neon);
    box-shadow: 0 0 0 2px rgba(62, 242, 200, 0.3);
  }
  .volume {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: #100c1a;
    border: 1px solid rgba(62, 242, 200, 0.2);
    border-radius: 10px;
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
  }
  .mute-btn {
    flex-shrink: 0;
    width: 44px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #171226;
    border: 1px solid rgba(62, 242, 200, 0.35);
    border-radius: 8px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    cursor: pointer;
    color: var(--neon);
    transition: transform 0.08s ease, box-shadow 0.12s ease, filter 0.12s ease;
    padding: 0;
  }
  .mute-btn:hover { filter: brightness(1.2); }
  .mute-btn:active { transform: translateY(1px); }
  .mute-btn svg { width: 20px; height: 20px; display: block; }
  .mute-btn .icon-waves { transition: opacity 0.12s ease; }
  .mute-btn .icon-slash { opacity: 0; transition: opacity 0.12s ease; }
  .mute-btn.muted { color: var(--pink); border-color: rgba(255, 95, 162, 0.45); }
  .mute-btn.muted .icon-waves { opacity: 0; }
  .mute-btn.muted .icon-slash { opacity: 1; }
  .volume input[type="range"] {
    flex: 1;
    min-width: 0;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--neon) var(--fill, 80%), #241d33 var(--fill, 80%));
    border: 1px solid rgba(62, 242, 200, 0.25);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
    outline: none;
    cursor: pointer;
  }
  .volume input[type="range"]:focus-visible {
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(62, 242, 200, 0.4);
  }
  .volume input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #d6fff2, var(--neon) 65%, #14624e);
    border: 1px solid var(--ink);
    box-shadow: 0 0 10px rgba(62, 242, 200, 0.6);
  }
  .volume input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #d6fff2, var(--neon) 65%, #14624e);
    border: 1px solid var(--ink);
    box-shadow: 0 0 10px rgba(62, 242, 200, 0.6);
  }
  .volume input[type="range"]::-moz-range-track {
    height: 6px;
    border-radius: 4px;
    background: transparent;
  }
  .vol-value {
    flex-shrink: 0;
    min-width: 52px;
    text-align: right;
    font-family: "Share Tech Mono", ui-monospace, monospace;
    font-size: 0.8rem;
    color: var(--neon);
    text-shadow: 0 0 8px rgba(62, 242, 200, 0.5);
    font-variant-numeric: tabular-nums;
  }
  .display {
    min-width: 0;
    margin-top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 20px;
    background: #0e0b18;
    border: 1px solid rgba(62, 242, 200, 0.22);
    border-radius: 12px;
    box-shadow: inset 0 2px 16px rgba(0, 0, 0, 0.7);
  }
  .bpm { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
  .bpm .label {
    font-family: "Orbitron", "Oswald", sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.32em;
    color: var(--pink);
    text-shadow: 0 0 10px rgba(255, 95, 162, 0.5);
  }
  .bpm .value {
    font-family: "Share Tech Mono", ui-monospace, monospace;
    font-size: 4.1rem;
    color: var(--neon);
    line-height: 1;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 24px rgba(62, 242, 200, 0.45);
  }
  .bpm .value small {
    font-size: 0.95rem;
    color: #7f789a;
    margin-left: 10px;
    letter-spacing: 0.24em;
    text-shadow: none;
  }
  .beat-lamp {
    position: relative;
    width: 104px;
    height: 76px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #1c1630 0%, #120e1e 100%);
    border: 1px solid rgba(62, 242, 200, 0.25);
    border-radius: 10px;
    box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.65);
    overflow: hidden;
    transition: background 0.06s ease, box-shadow 0.06s ease;
  }
  .beat-lamp.hit {
    background: linear-gradient(180deg, #241a3a 0%, #171226 100%);
    box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.65), 0 0 16px rgba(62, 242, 200, 0.35);
  }
  .vu-label {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    font-family: "Share Tech Mono", ui-monospace, monospace;
    font-size: 0.5rem;
    letter-spacing: 0.26em;
    color: #6f688c;
  }
  .vu-arc {
    position: absolute;
    left: 50%;
    bottom: 12px;
    width: 54px;
    height: 54px;
    transform: translateX(-50%) translateY(50%);
    border: 2px solid transparent;
    border-top-color: rgba(62, 242, 200, 0.5);
    border-radius: 50%;
  }
  .vu-tick {
    position: absolute;
    left: 50%;
    bottom: 12px;
    width: 2.5px;
    height: 10px;
    margin-left: -1.25px;
    background: rgba(62, 242, 200, 0.55);
    transform-origin: 50% 100%;
    transform: rotate(var(--a)) translateY(-24px);
  }
  .vu-needle {
    position: absolute;
    left: 50%;
    bottom: 12px;
    width: 3px;
    height: 44px;
    margin-left: -1.5px;
    background: linear-gradient(180deg, var(--pink) 0%, #7d2a4e 100%);
    border-radius: 2px;
    box-shadow: 0 0 8px rgba(255, 95, 162, 0.6);
    transform-origin: 50% 100%;
    transform: rotate(-42deg);
    transition: transform 0.16s cubic-bezier(0.3, 1.5, 0.45, 1);
  }
  .beat-lamp.hit .vu-needle { transform: rotate(34deg); }
  .vu-pivot {
    position: absolute;
    left: 50%;
    bottom: 6px;
    width: 13px;
    height: 13px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd9ec, var(--pink) 60%, #7d2a4e);
    border: 1px solid var(--ink);
    box-shadow: 0 0 8px rgba(255, 95, 162, 0.5);
    z-index: 2;
  }
  @media (max-width: 420px) {
    .display { flex-direction: column; text-align: center; gap: 14px; }
    .bpm { align-items: center; }
    .bpm .value { font-size: 3.1rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .beat-lamp .vu-needle { transition: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="display">
      <div class="bpm">
        <span class="label">Tempo</span>
        <span class="value"><span id="bpmValue">--</span><small>BPM</small></span>
      </div>
      <div class="beat-lamp" id="beatLamp" aria-hidden="true">
        <span class="vu-label">BEAT</span>
        <span class="vu-arc"></span>
        <span class="vu-tick" style="--a:-40deg"></span>
        <span class="vu-tick" style="--a:-20deg"></span>
        <span class="vu-tick" style="--a:0deg"></span>
        <span class="vu-tick" style="--a:20deg"></span>
        <span class="vu-tick" style="--a:40deg"></span>
        <span class="vu-needle"></span>
        <span class="vu-pivot"></span>
      </div>
    </div>

    <div class="volume">
      <button id="muteBtn" class="mute-btn" aria-pressed="false" aria-label="Mute sound" title="Mute / unmute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"></path>
          <g class="icon-waves">
            <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
            <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
          </g>
          <g class="icon-slash">
            <line x1="16" y1="9" x2="22" y2="15"></line>
            <line x1="22" y1="9" x2="16" y2="15"></line>
          </g>
        </svg>
      </button>
      <input type="range" id="volumeSlider" min="0" max="100" step="1" value="80" aria-label="Volume">
      <span class="vol-value" id="volValue">80%</span>
    </div>

    <div class="controls">
      <div class="mode-toggle" role="group" aria-label="MIDI mode">
        <button type="button" id="modeReceiveBtn" class="mode-btn active" aria-pressed="true">Receive</button>
        <button type="button" id="modeTransmitBtn" class="mode-btn" aria-pressed="false">Transmit</button>
      </div>
      <div class="tempo-row" id="tempoRow" style="display: none;">
        <label for="tempoInput">Tempo</label>
        <input type="number" id="tempoInput" min="20" max="300" step="1" value="120">
        <span class="tempo-unit">BPM</span>
      </div>
      <div class="row">
        <button id="enableBtn" class="primary">Enable MIDI</button>
      </div>
      <div class="row device-row" id="deviceRow" style="display: none;">
        <select id="deviceSelect" aria-label="MIDI input device" style="flex:1;"></select>
      </div>
    </div>

  </div>

<script>
(() => {
  "use strict";

  const TICKS_PER_QUARTER = 24;
  const BPM_SAMPLES = 8;          // rolling average window
  const MIN_BEAT_INTERVAL_MS = 30; // guard against jitter / double-fires

  const enableBtn = document.getElementById("enableBtn");
  const deviceRow = document.getElementById("deviceRow");
  const deviceSelect = document.getElementById("deviceSelect");
  const bpmValue = document.getElementById("bpmValue");
  const beatLamp = document.getElementById("beatLamp");
  const modeReceiveBtn = document.getElementById("modeReceiveBtn");
  const modeTransmitBtn = document.getElementById("modeTransmitBtn");
  const tempoRow = document.getElementById("tempoRow");
  const tempoInput = document.getElementById("tempoInput");
  const muteBtn = document.getElementById("muteBtn");
  const volumeSlider = document.getElementById("volumeSlider");
  const volValue = document.getElementById("volValue");

  let audioCtx = null;
  let masterGain = null;
  let volume = 0.8;
  let muted = false;
  try {
    const storedVol = parseFloat(localStorage.getItem("midiTickVolume"));
    if (!Number.isNaN(storedVol)) volume = Math.min(1, Math.max(0, storedVol));
    muted = localStorage.getItem("midiTickMuted") === "1";
  } catch (e) { /* storage unavailable */ }
  let midiAccess = null;
  let selectedInput = null;
  let selectedOutput = null;
  let mode = "receive"; // "receive" | "transmit"
  let transmitBpm = 120;
  try {
    const storedBpm = parseFloat(localStorage.getItem("midiTickBpm"));
    if (!Number.isNaN(storedBpm)) transmitBpm = Math.min(300, Math.max(20, storedBpm));
  } catch (e) { /* storage unavailable */ }
  let transmitTimer = null;
  let transmitTickCount = 0;
  let ticks = 0;
  let lastBeatTime = null;
  let lastTickTime = null;
  let intervalSamples = [];
  let lampTimeout = null;

  // ---------- Audio ----------
  function ensureAudio() {
    if (!audioCtx) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      audioCtx = new Ctor();
      masterGain = audioCtx.createGain();
      masterGain.connect(audioCtx.destination);
      applyVolume();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function applyVolume() {
    if (!masterGain || !audioCtx) return;
    const target = muted ? 0 : volume;
    masterGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.01);
  }

  function saveVolumePrefs() {
    try {
      localStorage.setItem("midiTickVolume", String(volume));
      localStorage.setItem("midiTickMuted", muted ? "1" : "0");
    } catch (e) { /* storage unavailable */ }
  }

  function updateVolumeUI() {
    const pct = Math.round(volume * 100);
    volumeSlider.value = String(pct);
    volumeSlider.style.setProperty("--fill", pct + "%");
    volValue.textContent = muted ? "MUTED" : pct + "%";
    muteBtn.classList.toggle("muted", muted);
    muteBtn.setAttribute("aria-pressed", muted ? "true" : "false");
    muteBtn.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
    applyVolume();
  }

  function playTick() {
    const ctx = ensureAudio();
    if (!ctx) return;
    const t = ctx.currentTime;

    // Low "knock" body: a short sine dropping in pitch.
    const body = ctx.createOscillator();
    const bodyGain = ctx.createGain();
    body.type = "sine";
    body.frequency.setValueAtTime(340, t);
    body.frequency.exponentialRampToValueAtTime(130, t + 0.045);
    bodyGain.gain.setValueAtTime(0.0001, t);
    bodyGain.gain.exponentialRampToValueAtTime(0.4, t + 0.004);
    bodyGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    body.connect(bodyGain).connect(masterGain);
    body.start(t);
    body.stop(t + 0.1);

    // Sharp "wood" attack: a short filtered noise burst.
    const noiseLen = Math.ceil(ctx.sampleRate * 0.06);
    const noiseBuffer = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
    const noiseData = noiseBuffer.getChannelData(0);
    for (let i = 0; i < noiseLen; i++) {
      noiseData[i] = (Math.random() * 2 - 1) * (1 - i / noiseLen);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;
    const band = ctx.createBiquadFilter();
    band.type = "bandpass";
    band.frequency.setValueAtTime(1150, t);
    band.Q.value = 7;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.0001, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.2, t + 0.003);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    noise.connect(band).connect(noiseGain).connect(masterGain);
    noise.start(t);
    noise.stop(t + 0.06);
  }

  // ---------- Beat handling ----------
  function onBeat() {
    const now = performance.now();
    if (mode === "receive") {
      if (lastBeatTime !== null) {
        const interval = now - lastBeatTime;
        if (interval >= MIN_BEAT_INTERVAL_MS) {
          intervalSamples.push(interval);
          if (intervalSamples.length > BPM_SAMPLES) intervalSamples.shift();
          const avg = intervalSamples.reduce((a, b) => a + b, 0) / intervalSamples.length;
          const bpm = 60000 / avg;
          bpmValue.textContent = bpm.toFixed(1);
        }
      }
      lastBeatTime = now;
      lastTickTime = now;
      ticks = 0;
    }

    playTick();
    flashLamp();
  }

  function flashLamp() {
    beatLamp.classList.add("hit");
    if (lampTimeout) clearTimeout(lampTimeout);
    lampTimeout = setTimeout(() => beatLamp.classList.remove("hit"), 110);
  }

  // ---------- Transmit ----------
  function startTransmit() {
    stopTransmit();
    if (mode !== "transmit" || !midiAccess || !selectedOutput) return;
    const interval = 60000 / transmitBpm / TICKS_PER_QUARTER;
    let nextTime = performance.now() + interval;
    const tick = () => {
      try {
        selectedOutput.send([0xF8]);
      } catch (e) {
        stopTransmit();
        enableBtn.textContent = "Output lost — retry";
        return;
      }
      transmitTickCount++;
      if (transmitTickCount >= TICKS_PER_QUARTER) {
        transmitTickCount = 0;
        onBeat();
      }
      nextTime += interval;
      // Skip ahead if we've fallen behind (tab throttling, etc.)
      if (nextTime < performance.now()) nextTime = performance.now() + interval;
      transmitTimer = setTimeout(tick, Math.max(0, nextTime - performance.now()));
    };
    transmitTimer = setTimeout(tick, interval);
  }

  function stopTransmit() {
    if (transmitTimer) clearTimeout(transmitTimer);
    transmitTimer = null;
    transmitTickCount = 0;
  }

  function setMode(next) {
    if (next === mode) return;
    mode = next;
    modeReceiveBtn.classList.toggle("active", mode === "receive");
    modeReceiveBtn.setAttribute("aria-pressed", mode === "receive" ? "true" : "false");
    modeTransmitBtn.classList.toggle("active", mode === "transmit");
    modeTransmitBtn.setAttribute("aria-pressed", mode === "transmit" ? "true" : "false");
    tempoRow.style.display = mode === "transmit" ? "flex" : "none";
    stopTransmit();
    if (selectedInput) {
      selectedInput.onmidimessage = null;
      selectedInput = null;
    }
    selectedOutput = null;
    if (mode === "transmit") {
      bpmValue.textContent = transmitBpm.toFixed(1);
    } else {
      bpmValue.textContent = "--";
      intervalSamples = [];
      lastBeatTime = null;
      lastTickTime = null;
    }
    if (midiAccess) populateDevices();
  }

  // ---------- MIDI ----------
  function handleMessage(event) {
    const data = event.data;
    if (!data || data.length === 0) return;
    // MIDI clock is 0xF8; accept it with or without a status byte prefix.
    if (data[0] !== 0xF8) return;

    ticks++;
    if (ticks >= TICKS_PER_QUARTER) {
      ticks = 0;
      onBeat();
    }
  }

  function populateDevices() {
    if (!midiAccess) return;
    deviceSelect.innerHTML = "";
    const isReceive = mode === "receive";
    const devices = [...(isReceive ? midiAccess.inputs.values() : midiAccess.outputs.values())];
    if (devices.length === 0) {
      deviceRow.style.display = "none";
      enableBtn.textContent = isReceive ? "No MIDI inputs — retry" : "No MIDI outputs — retry";
      if (!isReceive) stopTransmit();
      return;
    }
    deviceRow.style.display = "flex";
    deviceSelect.setAttribute("aria-label", isReceive ? "MIDI input device" : "MIDI output device");
    for (const device of devices) {
      const opt = document.createElement("option");
      opt.value = device.id;
      opt.textContent = device.name || (isReceive ? "Input " + device.id : "Output " + device.id);
      deviceSelect.appendChild(opt);
    }
    // Preserve selection if still present.
    const current = isReceive ? selectedInput : selectedOutput;
    if (current && devices.some(d => d.id === current.id)) {
      deviceSelect.value = current.id;
    }
    bindSelectedDevice();
  }

  function bindSelectedDevice() {
    if (mode === "receive") {
      if (selectedInput) {
        selectedInput.onmidimessage = null;
      }
      const id = deviceSelect.value;
      const input = midiAccess && midiAccess.inputs.get(id);
      selectedInput = input || null;
      if (selectedInput) {
        selectedInput.onmidimessage = handleMessage;
        enableBtn.textContent = "Re-scan devices";
      }
    } else {
      stopTransmit();
      const id = deviceSelect.value;
      const output = midiAccess && midiAccess.outputs.get(id);
      selectedOutput = output || null;
      if (selectedOutput) {
        enableBtn.textContent = "Re-scan devices";
        startTransmit();
      }
    }
  }

  // ---------- Enable ----------
  async function enable() {
    enableBtn.disabled = true;
    enableBtn.textContent = "Requesting…";

    if (!navigator.requestMIDIAccess) {
      enableBtn.textContent = "MIDI not supported";
      enableBtn.disabled = false;
      return;
    }

    try {
      midiAccess = await navigator.requestMIDIAccess();
    } catch (err) {
      enableBtn.textContent = "MIDI denied — retry";
      enableBtn.disabled = false;
      return;
    }

    ensureAudio();
    populateDevices();
    enableBtn.disabled = false;

    // Re-populate when devices come and go.
    midiAccess.onstatechange = () => {
      const isReceive = mode === "receive";
      const prevId = isReceive ? (selectedInput && selectedInput.id) : (selectedOutput && selectedOutput.id);
      populateDevices();
      // If the previously selected device vanished, pick the first available.
      const current = isReceive ? selectedInput : selectedOutput;
      const gone = isReceive
        ? (!selectedInput || (prevId && !midiAccess.inputs.get(prevId)))
        : (!selectedOutput || (prevId && !midiAccess.outputs.get(prevId)));
      if (!current || gone) {
        const first = (isReceive ? midiAccess.inputs.values() : midiAccess.outputs.values()).next().value;
        if (first) {
          deviceSelect.value = first.id;
          bindSelectedDevice();
        }
      }
    };
  }

  volumeSlider.addEventListener("input", () => {
    volume = parseInt(volumeSlider.value, 10) / 100;
    if (volume > 0 && muted) muted = false;
    updateVolumeUI();
    saveVolumePrefs();
  });
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    updateVolumeUI();
    saveVolumePrefs();
  });
  updateVolumeUI();

  modeReceiveBtn.addEventListener("click", () => setMode("receive"));
  modeTransmitBtn.addEventListener("click", () => setMode("transmit"));
  tempoInput.addEventListener("input", () => {
    const v = parseFloat(tempoInput.value);
    if (Number.isNaN(v)) return;
    transmitBpm = Math.min(300, Math.max(20, v));
    bpmValue.textContent = transmitBpm.toFixed(1);
    try { localStorage.setItem("midiTickBpm", String(transmitBpm)); } catch (e) { /* storage unavailable */ }
    if (mode === "transmit") startTransmit();
  });
  tempoInput.addEventListener("blur", () => {
    tempoInput.value = String(transmitBpm);
  });
  try { tempoInput.value = String(transmitBpm); } catch (e) { /* ignore */ }

  enableBtn.addEventListener("click", enable);
  deviceSelect.addEventListener("change", bindSelectedDevice);

  // Keep the clock/lamp from drifting after long idle periods (receive mode).
  setInterval(() => {
    if (mode === "receive" && lastTickTime && performance.now() - lastTickTime > 5000) {
      // No clock for 5s — reset the tempo window so it doesn't go stale.
      intervalSamples = [];
      lastBeatTime = null;
      bpmValue.textContent = "--";
    }
  }, 1000);
})();
</script>
</body>
</html>
